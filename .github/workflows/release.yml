name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Write access is granted only to the jobs that create releases
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # The platforms .goreleaser.yaml builds for a tag. macOS is Apple Silicon
    # only, for the reason given there. CGO_ENABLED=0 makes every one of these a
    # cross-compile the runner can do on its own.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_arch: x86_64
          - goos: linux
            goarch: arm64
            asset_arch: arm64
          - goos: darwin
            goarch: arm64
            asset_arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o mrs ./main.go
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      # Named and laid out like the archives goreleaser publishes for a tag, so
      # what installs a tagged release installs a dev one by changing the URL
      # and nothing else. An asset whose name does not carry its platform is one
      # a consumer has to be told about out of band.
      - name: Archive
        run: |
          tar -czf mrs_${{ matrix.goos }}_${{ matrix.asset_arch }}.tar.gz \
              mrs LICENSE README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mrs_${{ matrix.goos }}_${{ matrix.asset_arch }}
          path: mrs_${{ matrix.goos }}_${{ matrix.asset_arch }}.tar.gz

  goreleaser:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Matched by name, not merged blindly: `files: artifacts/*` publishes
      # whatever lands here, so an unrelated artifact uploaded by some later
      # step would otherwise become a dev-release asset no checksum covers.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: mrs_*
          merge-multiple: true

      # As goreleaser does for a tag. The consumer can then verify what it
      # fetched, which matters more here than there: `dev` is a moving tag, so a
      # download that straddles a re-cut would otherwise go unnoticed.
      - name: Write checksums
        run: cd artifacts && sha256sum *.tar.gz > checksums.txt

      # A release follows its tag, and updating one below does not move the tag
      # GitHub already has, so `dev` has to be repointed here or the release's
      # commit link and source archives would describe an older build than the
      # assets beside them. Unmasked on purpose: a rejected tag push — tag
      # protection, credentials the checkout did not persist — has to fail the
      # job rather than quietly publish binaries stamped with the wrong commit.
      - name: Move the dev tag to this commit
        run: |
          git tag --force dev
          git push --force origin refs/tags/dev

      # Updated in place rather than deleted and recreated. Deleting first left
      # `dev` a 404 for the length of the upload, and permanently if the run
      # died in between; every asset name here is deterministic, so each upload
      # replaces its predecessor and nothing from the previous cut survives.
      - name: Publish dev release
        uses: softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev
          name: dev
          body: Latest build from main branch
          make_latest: "false"
          files: artifacts/*
